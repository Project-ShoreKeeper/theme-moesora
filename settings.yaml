apiVersion: v1alpha1
kind: Setting
metadata:
  name: moesora-settings
spec:
  forms:
  - group: basic
    label: General
    formSchema:
    - $formkit: text
      name: document_hidden_title
      label: Tab Title when Inactive
      value: (つ_<)~ 你去哪儿了！
      help: Text displayed in browser tab when user switches to another tab. Leave blank to keep original title.
    - $formkit: text
      name: document_visible_title
      label: Tab Title upon Return
      value: (*´∇｀*) 欢迎回来！
      help: Welcome text temporarily displayed when user returns to this tab. Leave blank to disable.
    - $formkit: text
      name: blog_name
      label: Blog Name
      help: Global fallback name for navbar, hero banner, and profile card. Leave blank to use site title.
      value: ''
    - $formkit: text
      name: name_navbar
      label: Navbar Display Name
      help: Brand title in top-left navigation bar. Leave blank to fallback to Blog Name or site title.
      value: ''
    - $formkit: text
      name: navbar_login_url
      label: Navbar Login URL
      help: 'Link for login button in top right. Default: /console.'
      value: /console
    - $formkit: text
      name: name_hero
      label: Hero Display Name
      help: Title shown on homepage hero banner. Leave blank to use site title.
      value: ''
    - $formkit: text
      name: name_profile
      label: Profile Card Name
      help: Name displayed on sidebar profile card. Leave blank to use site title.
      value: ''
    - $formkit: textarea
      name: signature
      label: Terminal Typewriter Subtitle
      rows: 3
      help: Animated typewriter subtitle beneath hero banner. One sentence per line (looped). Leave blank to use site subtitle.
      value: ''
    - $formkit: attachment
      name: hero_bg
      label: Hero Background Image
      help: Custom background image for homepage hero. Leave blank for default gradient.
      value: ''
    - $formkit: text
      name: hero_video
      label: Hero Background Video URL
      help: Direct video URL (mp4/webm). Plays muted in a loop. Background image acts as poster.
      value: ''
    - $formkit: select
      name: hero_enable
      label: Hero Banner Visibility
      value: true
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: select
      name: hero_mode
      label: Hero Height Mode
      value: banner
      options:
      - label: Banner (Standard Height)
        value: banner
      - label: Fullscreen (100vh)
        value: fullscreen
    - $formkit: text
      name: site_bg
      label: Global Background Image / API
      help: Custom image URL or random wallpaper API URL. Leave blank for solid background.
      value: ''
    - $formkit: select
      name: site_bg_mode
      label: Background Image Display Scope
      value: all
      help: When selecting 'All Pages Except Home', the site background is hidden on homepage and shown on all sub-pages.
      options:
      - label: All Pages (Including Home)
        value: all
      - label: All Pages Except Home
        value: not_home
    - $formkit: color
      name: theme_color
      label: Theme Color
      value: '#f9a8d4'
      help: 'Default: Sakura Pink (#f9a8d4)'
    - $formkit: color
      name: night_theme_color
      label: Dark Mode Theme Color
      value: '#f0a5cb'
    - $formkit: select
      name: default_theme
      label: Default Color Scheme
      value: auto
      options:
      - label: Light Mode
        value: light
      - label: Dark Mode
        value: dark
      - label: Follow System
        value: auto
    - $formkit: select
      name: sidebar_column
      label: Sidebar Column Layout
      value: three
      options:
      - label: Three Columns (Left + Content + Right)
        value: three
      - label: Left Sidebar Only
        value: left
      - label: Right Sidebar Only
        value: right
    - $formkit: select
      name: sidebar_swap
      label: Swap Left & Right Sidebars
      value: false
      help: When enabled, swaps profile sidebar to the right and widgets sidebar to the left (desktop only).
      options:
      - label: Default (Profile on Left)
        value: false
      - label: Swapped (Profile on Right)
        value: true
  - group: loading
    label: Loading & Transitions
    formSchema:
    - $formkit: select
      name: load_progress
      label: Top Loading Progress Bar
      value: false
      help: Displays a thin progress bar at the top of the page during navigation.
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: text
      name: loading_text
      label: Loading Message
      value: 少女祈祷中...
      help: Text shown while the page transition is taking place.
  - group: post
    label: Posts & Content
    formSchema:
    - $formkit: select
      name: code_pretty
      label: Code Syntax Highlighting Theme
      value: atom-one-dark
      options:
      - label: Atom One Dark (Dark)
        value: atom-one-dark
      - label: Atom One Light (Light)
        value: atom-one-light
      - label: GitHub (Light)
        value: github
      - label: GitHub Dark (Dark)
        value: github-dark
      - label: GitHub Dark Dimmed (Dark)
        value: github-dark-dimmed
      - label: Monokai (Dark)
        value: monokai
      - label: Monokai Sublime (Dark)
        value: monokai-sublime
      - label: Dracula (Dark)
        value: base16/dracula
      - label: Nord (Dark)
        value: nord
      - label: Night Owl (Dark)
        value: night-owl
      - label: Tokyo Night Dark (Dark)
        value: tokyo-night-dark
      - label: Tokyo Night Light (Light)
        value: tokyo-night-light
      - label: One Dark Pro / Obsidian (Dark)
        value: obsidian
      - label: Shades of Purple (Dark)
        value: shades-of-purple
      - label: Gradient Dark 渐变 (Dark)
        value: gradient-dark
      - label: VS 2015 (Dark)
        value: vs2015
      - label: Androidstudio (Dark)
        value: androidstudio
      - label: Agate (Dark)
        value: agate
      - label: StackOverflow Dark (Dark)
        value: stackoverflow-dark
      - label: StackOverflow Light (Light)
        value: stackoverflow-light
      - label: VS (Light)
        value: vs
      - label: Xcode (Light)
        value: xcode
      - label: Idea (Light)
        value: idea
      - label: Solarized Dark (Dark)
        value: base16/solarized-dark
      - label: Solarized Light (Light)
        value: base16/solarized-light
      - label: Kimbie Dark (Dark)
        value: kimbie-dark
      - label: Tomorrow Night Blue (Dark)
        value: tomorrow-night-blue
    - $formkit: select
      name: enable_katex
      label: KaTeX Math Formula Rendering
      value: false
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: select
      name: enable_lightbox
      label: Image Lightbox Viewer
      value: true
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: select
      name: enable_copyright
      label: Post Copyright Notice
      value: true
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: select
      name: enable_reward
      label: Post Donation / Sponsor
      value: false
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: attachment
      name: reward_wechat
      label: Sponsor - WeChat Pay QR Code
    - $formkit: attachment
      name: reward_alipay
      label: Sponsor - Alipay QR Code
    - $formkit: select
      name: enable_post_share
      label: Post Social Sharing Bar
      value: false
      help: Displays sharing buttons at the bottom of posts (Copy Link, Telegram, X / Twitter, Weibo, etc.).
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: text
      name: default_thumbnail
      label: Default Post Cover Image
      help: Fallback cover image URL when article has no cover image. Leave blank to hide cover.
      value: ''
    - $formkit: number
      name: code_fold_line
      label: Code Block Auto-Collapse Lines
      help: Code blocks with more than this number of lines will be collapsed. Enter 0 to disable.
      value: 0
    - $formkit: number
      name: img_fold_height
      label: Article Long Image Collapse Height (px)
      help: Images exceeding this height will be collapsed. Enter 0 to disable.
      value: 0
    - $formkit: select
      name: heading_anim
      label: Post Header Animations
      value: true
      help: Enables interactive animations on article headings and ordered list numbers.
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: color
      name: ol_hover_color
      label: Ordered List Hover Accent Color
      value: '#ff7eb3'
      help: Accent color when hovering over numbered list items (1, 2, 3...) in posts.
    - $formkit: text
      name: default_code_lang
      label: Default Code Highlight Language
      value: ''
      help: Language used when none is specified (e.g. bash, python, js).
    - $formkit: textarea
      name: copy_explain
      label: Append Copyright Notice on Copy
      help: Appends copyright text when copying more than 20 characters. Use {url} for link. Leave blank to disable.
      value: ''
    - $formkit: select
      name: external_redirect
      label: External Link Safety Prompt
      value: false
      help: Shows a security warning modal before navigating to external URLs, protecting visitors from phishing.
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: number
      name: external_redirect_delay
      label: Redirect Countdown Timer (Seconds)
      value: 9
      help: 'Seconds to wait before redirect button activates. Default: 9s. Set 0 for immediate click.'
    - $formkit: textarea
      name: external_redirect_whitelist
      label: External Link Whitelist Domains
      value: ''
      help: Domains that bypass the confirmation dialog. Comma-separated or one per line (e.g. github.com, google.com).
  - group: sidebar
    label: Sidebar & Widgets
    formSchema:
    - $formkit: repeater
      name: left_modules
      label: Left Sidebar Widgets (Drag to reorder, remove to hide)
      help: Select and reorder widgets displayed in the left sidebar.
      value:
      - module: toc
      - module: profile
      - module: recent
      - module: tags
      children:
      - $formkit: select
        name: module
        label: 模块
        options:
        - label: Posts & ContentTable of Contents(仅Posts & Content页显示)
          value: toc
        - label: 个人信息卡
          value: profile
        - label: Announcements
          value: notice
        - label: Love Story
          value: love
        - label: Music Player播放器
          value: music
        - label: About
          value: about
        - label: Friend Links
          value: links
        - label: Recent Posts
          value: recent
        - label: Categories
          value: categories
        - label: Tag Cloud
          value: tags
        - label: Time & Weather
          value: weather
        - label: Daily Quote
          value: quote
    - $formkit: repeater
      name: right_modules
      label: Right Sidebar Widgets (Drag to reorder, remove to hide)
      help: Select and reorder widgets displayed in the right sidebar.
      value:
      - module: notice
      - module: love
      - module: music
      - module: about
      - module: links
      children:
      - $formkit: select
        name: module
        label: 模块
        options:
        - label: Posts & ContentTable of Contents(仅Posts & Content页显示)
          value: toc
        - label: 个人信息卡
          value: profile
        - label: Announcements
          value: notice
        - label: Love Story
          value: love
        - label: Music Player播放器
          value: music
        - label: About
          value: about
        - label: Friend Links
          value: links
        - label: Recent Posts
          value: recent
        - label: Categories
          value: categories
        - label: Tag Cloud
          value: tags
        - label: Time & Weather
          value: weather
        - label: Daily Quote
          value: quote
    - $formkit: repeater
      name: mobile_modules
      label: Mobile Sidebar Widgets (Drag to reorder, remove to hide)
      help: Controls which widgets appear on mobile devices and their order. Leave blank for default.
      value:
      - module: notice
      - module: recent
      - module: categories
      children:
      - $formkit: select
        name: module
        label: 模块
        options:
        - label: Announcements
          value: notice
        - label: Love Story
          value: love
        - label: Music Player播放器
          value: music
        - label: About
          value: about
        - label: Friend Links
          value: links
        - label: Recent Posts
          value: recent
        - label: Categories
          value: categories
        - label: Tag Cloud
          value: tags
        - label: Time & Weather
          value: weather
        - label: Daily Quote
          value: quote
    - $formkit: textarea
      name: notice_content
      label: Announcement - Content
      help: Leave blank for default text. Supports HTML.
      value: ''
    - $formkit: textarea
      name: about_content
      label: About - Content
      help: Leave blank for default text. Supports HTML.
      value: ''
    - $formkit: number
      name: links_limit
      label: Sidebar Friend Links - Max Display Count
      help: Maximum friend links to show in sidebar widget. 0 or blank for all.
      value: 5
      min: 0
    - $formkit: text
      name: weather_city
      label: Time & Weather - City
      help: Default city name (e.g. Tokyo, London, Paris). Leave blank to auto-detect by visitor IP.
      value: ''
    - $formkit: select
      name: weather_gps
      label: Time & Weather - Enable Precise GPS Button
      help: Shows a 'Use GPS' button allowing visitors to request exact local weather.
      value: 'false'
      options:
      - label: Disabled
        value: 'false'
      - label: Enabled
        value: 'true'
    - $formkit: select
      name: quote_mode
      label: Daily Quote - Source Mode
      help: 'Select quote source: ''Custom Quotes Only'' (offline), ''API Only'', or ''API First with Custom Fallback''.'
      value: api_fallback
      options:
      - label: API First with Custom Fallback
        value: api_fallback
      - label: API Only
        value: api
      - label: Custom Quotes Only (Offline)
        value: custom
    - $formkit: text
      name: quote_api_url
      label: Daily Quote - API Endpoint URL
      help: 'Default: Hitokoto API. You can also specify your own compatible API URL.'
      value: https://v1.hitokoto.cn/
    - $formkit: repeater
      name: quote_custom_list
      label: Daily Quote - Custom Quotes List
      help: Randomly selected quotes shown when in custom or fallback mode.
      value:
      - text: The starlight whispers across quiet shores.
        author: ''
      - text: May your journey be filled with light and wondrous wonders.
        author: ''
      children:
      - $formkit: text
        name: text
        label: Quote Text
      - $formkit: text
        name: author
        label: Author / Source (Optional)
    - $formkit: number
      name: recent_posts_count
      label: Recent Posts - Display Count
      value: 5
    - $formkit: number
      name: category_count
      label: Categories - Max Display Count
      help: Maximum categories shown in sidebar (enter positive integer, or 999 for all).
      value: 8
    - $formkit: number
      name: tag_count
      label: Tags - Max Display Count
      help: Maximum tags shown in sidebar (enter positive integer, or 999 for all).
      value: 20
    - $formkit: attachment
      name: profile_avatar
      label: Profile Card - Avatar URL
      help: Avatar URL for profile card. Leave blank to use site logo.
    - $formkit: text
      name: profile_signature
      label: Profile Card - Bio Motto
      help: Short bio displayed beneath profile name. Leave blank to use site subtitle.
      value: ''
    - $formkit: text
      name: profile_location
      label: Profile Card - Location Tag
      help: Displayed between profile name and stats (e.g., Tokyo, Japan). Leave blank to hide.
      value: ''
    - $formkit: select
      name: love_enable
      label: Love Story - Enabled
      value: false
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: attachment
      name: love_oneself_avatar
      label: Love Story - Partner 1 Avatar URL
    - $formkit: text
      name: love_oneself_url
      label: Love Story - Partner 1 Website URL
    - $formkit: attachment
      name: love_opposite_avatar
      label: Love Story - Partner 2 Avatar URL
    - $formkit: text
      name: love_opposite_url
      label: Love Story - Partner 2 Website URL
    - $formkit: text
      name: love_time
      label: Love Story - Anniversary Date (YYYY-MM-DD)
      help: 'Format: YYYY-MM-DD, used to calculate relationship duration.'
    - $formkit: select
      name: music_enable
      label: Music Player播放器-Enabled
      value: false
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: text
      name: netease_playlist_id
      label: Music - NetEase Playlist ID
      help: The numeric playlist ID from NetEase URL playlist?id=
    - $formkit: select
      name: music_float
      label: Music Player - Display Mode
      value: false
      help: Floating mode docks to screen bottom without interrupting playback on page switch; sidebar mode renders inside the widget column.
      options:
      - label: 右下/左下角悬浮（切页不断歌）
        value: true
      - label: Sidebar Card
        value: false
    - $formkit: repeater
      name: social_links
      label: Social Media Channels
      help: Rendered beneath profile card statistics with hover tooltip.
      value: []
      children:
      - $formkit: select
        name: platform
        label: Platform
        value: link
        options:
        - label: GitHub
          value: github
        - label: Email
          value: email
        - label: RSS Feed
          value: rss
        - label: Twitter / X
          value: twitter
        - label: Facebook
          value: facebook
        - label: Telegram
          value: telegram
        - label: Bilibili
          value: bilibili
        - label: YouTube
          value: youtube
        - label: Instagram
          value: instagram
        - label: QQ
          value: qq
        - label: Weibo
          value: weibo
        - label: Other Link
          value: link
      - $formkit: text
        name: name
        label: Platform Name (Tooltip)
        value: ''
      - $formkit: text
        name: url
        label: Target URL
        value: ''
  - group: effects
    label: Visual Effects & Animation
    formSchema:
    - $formkit: select
      name: effects_bg
      label: Background Particle Effect
      value: none
      options:
      - label: None / Disabled
        value: none
      - label: Falling Sakura Petals
        value: sakura
      - label: Falling Snowflakes
        value: snow
      - label: Cosmic Starlight
        value: universe
    - $formkit: select
      name: effects_bg_mode
      label: Background Effect Scope
      value: all
      options:
      - label: All Color Modes
        value: all
      - label: Light Mode Only
        value: light
      - label: Dark Mode Only
        value: dark
    - $formkit: select
      name: effects_click
      label: Mouse Click Particle Effect
      value: none
      options:
      - label: None / Disabled
        value: none
      - label: Floating Hearts
        value: heart
      - label: Sparkling Fireworks
        value: firework
    - $formkit: select
      name: effects_move
      label: Mouse Cursor Trail
      value: none
      options:
      - label: None / Disabled
        value: none
      - label: Glowing Orbs Trail
        value: dot
      - label: Sakura Petals Trail
        value: sakura
      - label: Snowflakes Trail
        value: snow
    - $formkit: select
      name: cursor_style
      label: Mouse Cursor Style
      value: default
      help: Built-in 'Pink-Paper' and 'Sakura' cursors ready to use.
      options:
      - label: Default Browser Cursor
        value: default
      - label: Pink-Paper
        value: Pink-Paper
      - label: Sakura
        value: Sakura
    - $formkit: select
      name: gray_mode
      label: Grayscale Memorial Mode
      value: false
      help: Applies grayscale filter across entire website for memorial days.
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: select
      name: enable_pjax
      label: Pjax Instant Page Transitions
      value: false
      help: Provides smooth AJAX page transitions without full browser reload.
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
  - group: footer
    label: Footer
    formSchema:
    - $formkit: text
      name: since
      label: Site Launch Date
      help: 'Format: YYYY-MM-DD. Displays live uptime in footer. Leave blank to hide.'
    - $formkit: text
      name: icp
      label: ICP Filing Number
      help: e.g. ICP12345678. Leave blank to hide.
    - $formkit: text
      name: police_text
      label: Public Security Filing Text
      help: e.g. Security Filing 11010802012345. Leave blank to hide.
    - $formkit: text
      name: police_code
      label: 公安备案-编号(纯数字)
      help: 公安备案号里的纯数字部分，用于生成查询跳转链接
    - $formkit: text
      name: powered_name
      label: Footer Powered by 文字
      value: Halo
      help: Footer "Powered by" 后面显示的文字，可改成站点名称或昵称
    - $formkit: text
      name: powered_url
      label: Footer Powered by 链接
      value: https://halo.run
      help: 点击上面文字跳转的地址，如站点主页
    - $formkit: text
      name: theme_name
      label: Footer Theme 文字
      value: Moesora
    - $formkit: text
      name: theme_url
      label: Footer Theme 链接
      value: ''
      help: 点击 Theme 文字跳转的地址，如 GitHub 主题源码页；留空则跳首页
  - group: comment
    label: Comments
    formSchema:
    - $formkit: select
      name: comment_system
      label: Comments系统
      value: moesora
      help: 「Moesora 内置Comments」为主题自带，游客填昵称+QQ+手机号+邮箱即可Comments，None / Disabled需登录（需在 Halo 后台「Comments设置」Enabled允许匿名/自定义账号Comments）；Halo 原生Comments功能全；Twikoo/Waline 的客户端脚本已内置，只需填各自的服务端（envId / serverURL）
      options:
      - label: Moesora Built-in Comments
        value: moesora
      - label: Halo Native Comments
        value: native
      - label: Twikoo
        value: twikoo
      - label: Waline
        value: waline
      - label: 不显示Comments
        value: none
    - $formkit: text
      name: comment_upload_url
      label: Comments图片上传接口（图床）
      value: ''
      help: 仅内置Comments。填写后游客插入图片会上传到该接口(form-data)并取回直链插入Comments，效果同参考站(![名](链接))；留空则图片压缩后内嵌发送。例：自建 EasyImage/Lsky 的上传地址
    - $formkit: text
      name: comment_upload_field
      label: 图床文件字段名
      value: file
      help: 上传时图片对应的表单字段名，多数图床为 file
    - $formkit: text
      name: comment_upload_resp
      label: 图床返回URL字段路径
      value: data.url
      help: 从图床 JSON 响应里取图片直链的路径，点号分隔，如 data.url；留空会自动尝试常见字段(url / data.url / data.links.url)
    - $formkit: text
      name: comment_upload_header
      label: 图床请求头（可选）
      value: ''
      help: '如需鉴权填一个请求头，形如 Authorization: Bearer 访问令牌'
    - $formkit: text
      name: twikoo_env_id
      label: Twikoo envId
      help: Twikoo 的环境 ID（腾讯云环境 ID 或 Vercel/自托管地址；客户端脚本已内置，None / Disabled需填脚本地址）
      value: ''
    - $formkit: text
      name: waline_server
      label: Waline Server URL
      value: ''
      help: Waline serverURL，如 https://your-waline.vercel.app（客户端脚本与样式已内置，None / Disabled需再填地址）
  - group: custom
    label: Custom Code & Scripts
    formSchema:
    - $formkit: repeater
      name: external_css
      label: 外部 CSS 链接
      help: 每条一个 CSS 文件地址（注入到 head）
      value: []
      children:
      - $formkit: text
        name: url
        label: CSS 地址
    - $formkit: textarea
      name: inline_css
      label: 内嵌 CSS
