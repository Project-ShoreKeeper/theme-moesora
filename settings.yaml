    formSchema:
    - $formkit: switch
      name: pwa_enable
      label: 启用 PWA
      value: false
      help: Enabled后：① 主题静态资源会被缓存，重复访问更快、断网仍可用；② 站点可「添加到主屏幕」作为应用安装。需在下方填好图标才能被浏览器识别为可安装
