      name: cdn_base
      label: 第三方库 CDN 前缀
      value: https://gcore.jsdelivr.net
      help: 代码高亮/公式/灯箱/Music Player播放器等库的 CDN 前缀。jsdelivr 官方(cdn.jsdelivr.net)在国内常被墙，已Default Browser Cursor改用镜像。若仍慢/失效可换：https://fastly.jsdelivr.net 、https://jsdelivr.b-cdn.net 、https://cdn.jsdelivr.net （路径需与 jsdelivr 一致，结尾不要加 /）
  - group: live2d
    label: Live2D Mascot
    formSchema:
    - $formkit: select
      name: live2d_enable
      label: 启用 Live2D Live2D Mascot
      value: false
      help: 在页面角落显示一个可互动的 Live2D 角色。模型地址需自行提供（见下方），运行库走 CDN、不占主题体积
      options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    - $formkit: select
      name: live2d_position
      label: 显示位置
      value: bottom-right
      options:
      - label: 右下角
        value: bottom-right
      - label: 左下角
        value: bottom-left
    - $formkit: number
      name: live2d_scale
      label: 缩放比例
      value: 1
      help: Live2D Mascot大小，1 为Default Browser Cursor，可填 0.8 / 1.2 等
    - $formkit: textarea
      name: live2d_models
      label: 模型列表
      value: '八千代辉夜姬|https://gcore.jsdelivr.net/gh/7l4i8y1a4n3g8-7l4i8y1a4n3g8-1438-9748/Yachiyo@master/Yachiyo.model3.json

        '
      help: 每行一个角色，格式：名称|模型json地址（Cubism3/4 用 .model3.json，Cubism2 用 .model.json）。多个角色时会出现切换按钮。模型需放在支持跨域(CORS)的地方，推荐 GitHub + jsDelivr
  - group: wishes
    label: Wish Wall
    formSchema:
    - $formkit: text
      name: wishes_subtitle
      label: Wish Wall-副标题
      value: 写下你的心愿，留下你的故事
    - $formkit: text
      name: wishes_categories
      label: Wish Wall-Categories
      help: 英文逗号分隔，如：心愿,树洞,反馈。访客发布时从中选择；第一项为Default Browser CursorCategories
      value: 心愿,树洞,反馈
  - group: seo
    label: SEO & Metadata
    formSchema:
    - $formkit: text
      name: seo_base_url
      label: 站点完整网址
      help: 用于 canonical 和分享卡片的绝对链接，如 https://example.com（结尾不要加斜杠；留空则用相对链接，分享缩略图可能None / Disabled法显示）
      value: ''
    - $formkit: text
      name: seo_description
      label: 站点Default Browser Cursor描述
      help: 首页及没有摘要的页面所用的 description；留空则使用站点副标题
      value: ''
    - $formkit: text
      name: seo_keywords
      label: 站点Default Browser Cursor关键词
      help: 英文逗号分隔。Posts & Content页会优先使用Posts & Content自身的标签作为关键词
      value: ''
    - $formkit: text
      name: seo_share_image
      label: Default Browser Cursor分享图
      help: 没有封面的页面分享到社交Platform时显示的图片（完整网址或站内路径）；留空则用站点 Logo
      value: ''
    - $formkit: text
      name: seo_rss_url
      label: RSS Feed地址
      help: 用于 <link rel=alternate> 订阅发现，Default Browser Cursor /rss.xml；请按实际启用的 RSS 插件地址填写
      value: /rss.xml
    - $formkit: switch
      name: seo_enable
      label: 启用 SEO 标签
      help: 总开关。若 SEO 标签导致页面异常，可在此Disabled（标题仍会正常显示）
      value: true
  - group: pwa
