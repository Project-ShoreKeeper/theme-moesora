<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:halo="https://halo.run"
      th:fragment="layout(content, hero, isHome)">
<head th:replace="~{modules/head :: head}"></head>
<body>
  <!-- 全站背景层（地址放 data-bg，由脚本赋给 background-image，最稳） -->
  <div class="moe-site-bg"
       th:if="${!#strings.isEmpty(theme.config.basic?.site_bg)}"
       th:attr="data-bg=${theme.config.basic.site_bg},data-mode=${theme.config.basic?.site_bg_mode}"
       th:style="${theme.config.basic?.site_bg_mode == 'not_home' and isHome == true} ? 'display:none' : ''"></div>

  <!-- Starlight murmurs across the shore... 加载层 -->
  <div id="moesora-loading"
       th:text="${theme.config.loading?.loading_text} ?: 'Starlight murmurs across the shore...'">Starlight murmurs across the shore...</div>

  <!-- 顶部导航 -->
  <div th:replace="~{modules/navbar :: navbar}"></div>

  <!-- 移动端右侧抽屉(独立于 navbar) -->
  <div th:replace="~{modules/drawer :: drawer}"></div>

  <!-- Pjax 进度条（无刷新切页时显示） -->
  <div id="moe-pjax-bar" class="moe-pjax-bar"></div>

  <!-- Pjax 切页时只替换这一块（大图 + 三列主体） -->
  <div id="moe-pjax">
  <!-- 通栏满宽大图（仅首页传入，其它页面为空） -->
  <div th:replace="${hero}"></div>

  <!-- 三列主体：左侧栏 / 正文 / 右侧栏（模块化布局：按后台配置的列表渲染，未配置则回退默认顺序） -->
  <div class="moe-layout"
       th:classappend="${(theme.config.basic?.sidebar_swap == true ? ' is-swapped' : '') + ' layout-' + (theme.config.basic?.sidebar_column ?: 'three') + ((theme.config.sidebar?.mobile_modules != null and !#lists.isEmpty(theme.config.sidebar.mobile_modules)) ? ' has-mobile-sidebar' : '')}">
    <aside class="moe-sidebar moe-sidebar-left"
           th:if="${(theme.config.basic?.sidebar_column ?: 'three') != 'right'}"
           th:with="lm=${theme.config.sidebar?.left_modules}">
      <th:block th:if="${lm != null and !#lists.isEmpty(lm)}" th:each="m : ${lm}">
        <th:block th:replace="~{modules/widgets :: widget(${m.module})}"></th:block>
      </th:block>
      <th:block th:if="${lm == null or #lists.isEmpty(lm)}" th:each="k : ${ {'toc','profile','recent','tags'} }">
        <th:block th:replace="~{modules/widgets :: widget(${k})}"></th:block>
      </th:block>
    </aside>
    <main class="moe-main">
      <div th:replace="${content}"></div>
    </main>
    <aside class="moe-sidebar moe-sidebar-mobile"
           th:if="${theme.config.sidebar?.mobile_modules != null and !#lists.isEmpty(theme.config.sidebar.mobile_modules)}">
      <th:block th:each="m : ${theme.config.sidebar.mobile_modules}"
                th:if="${m.module != 'toc' and m.module != 'profile'}">
        <th:block th:replace="~{modules/widgets :: widget(${m.module})}"></th:block>
      </th:block>
    </aside>
    <aside class="moe-sidebar moe-sidebar-right"
           th:if="${(theme.config.basic?.sidebar_column ?: 'three') != 'left'}"
           th:with="rm=${theme.config.sidebar?.right_modules}">
      <th:block th:if="${rm != null and !#lists.isEmpty(rm)}" th:each="m : ${rm}">
        <th:block th:replace="~{modules/widgets :: widget(${m.module})}"></th:block>
      </th:block>
      <th:block th:if="${rm == null or #lists.isEmpty(rm)}" th:each="k : ${ {'notice','love','music','about','links'} }">
        <th:block th:replace="~{modules/widgets :: widget(${k})}"></th:block>
      </th:block>
    </aside>
  </div>
  </div><!-- /#moe-pjax -->

  <!-- 全局悬浮音乐播放器：放在 #moe-pjax 外，Pjax 切页不中断播放；点 🎵 浮标弹出播放器 -->
  <!-- 全局悬浮音乐播放器：放在 #moe-pjax 外，Pjax 切页不中断播放；点 🎵 浮标弹出播放器 -->
  <div class="moe-music-float" id="moe-music-float"
       th:if="${(theme.config.sidebar?.music_enable ?: false) and (theme.config.sidebar?.music_float ?: false)}">
    <div class="moe-music-float-body moe-starlight-player">
      <div class="moe-stp-card" id="moe-stp-card">
        <!-- Top row: Cover + Title + Artist + Equalizer -->
        <div class="moe-stp-top">
          <div class="moe-stp-cover-wrap">
            <img class="moe-stp-cover" th:src="${theme.config.sidebar?.profile_avatar} ?: @{/assets/dist/logo.svg}" alt="Astrum Unicum"/>
            <div class="moe-stp-eq" id="moe-stp-eq">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="moe-stp-info">
            <div class="moe-stp-title">Astrum Unicum</div>
            <div class="moe-stp-artist">Shorekeeper Theme · Vanguard Sound</div>
          </div>
        </div>
        <!-- Progress Bar & Time -->
        <div class="moe-stp-seek">
          <div class="moe-stp-seek-bar" id="moe-stp-seek">
            <div class="moe-stp-seek-fill" id="moe-stp-fill"></div>
          </div>
          <div class="moe-stp-time">
            <span id="moe-stp-cur">0:00</span>
            <span id="moe-stp-dur">0:00</span>
          </div>
        </div>
        <!-- Controls row -->
        <div class="moe-stp-ctrls">
          <button type="button" class="moe-stp-btn moe-stp-play" id="moe-stp-playbtn" aria-label="Play/Pause">
            <svg class="moe-stp-ico-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="moe-stp-ico-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div class="moe-stp-vol-wrap">
            <button type="button" class="moe-stp-btn moe-stp-mute" id="moe-stp-mutebtn" aria-label="Mute/Unmute">
              <svg class="moe-stp-ico-vol" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <svg class="moe-stp-ico-muted" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            </button>
            <input type="range" class="moe-stp-vol" id="moe-stp-vol" min="0" max="1" step="0.05" value="0.8"/>
          </div>
        </div>
      </div>
      <!-- Native HTML5 audio stream pointing directly to local theme assets -->
      <audio id="moe-native-audio" th:src="@{/assets/audio/astrum-unicum.m4a}" preload="metadata" loop></audio>
    </div>
    <!-- Floating FAB -->
    <button class="moe-music-fab" id="moe-music-fab" type="button" aria-label="Music Player">
      <svg class="moe-music-ring" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
        <circle class="moe-music-track" cx="24" cy="24" r="21"/>
        <circle class="moe-music-prog" cx="24" cy="24" r="21"/>
      </svg>
      <svg class="moe-music-note" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
  </div>
  <script>
  (function(){
    var floatWrap = document.getElementById("moe-music-float");
    var fab = document.getElementById("moe-music-fab");
    var audio = document.getElementById("moe-native-audio");
    if (!floatWrap || !fab || !audio) return;

    var card = document.getElementById("moe-stp-card");
    var playBtn = document.getElementById("moe-stp-playbtn");
    var icoPlay = playBtn && playBtn.querySelector(".moe-stp-ico-play");
    var icoPause = playBtn && playBtn.querySelector(".moe-stp-ico-pause");
    var seekBar = document.getElementById("moe-stp-seek");
    var fill = document.getElementById("moe-stp-fill");
    var curTime = document.getElementById("moe-stp-cur");
    var durTime = document.getElementById("moe-stp-dur");
    var muteBtn = document.getElementById("moe-stp-mutebtn");
    var icoVol = muteBtn && muteBtn.querySelector(".moe-stp-ico-vol");
    var icoMuted = muteBtn && muteBtn.querySelector(".moe-stp-ico-muted");
    var volSlider = document.getElementById("moe-stp-vol");
    var prog = fab.querySelector(".moe-music-prog");
    var CIRCUMFERENCE = 131.95;

    function formatTime(s) {
      if (isNaN(s) || s < 0) return "0:00";
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function setRingProgress(p) {
      if (!prog) return;
      if (!(p >= 0)) p = 0;
      if (p > 1) p = 1;
      prog.style.strokeDashoffset = (CIRCUMFERENCE * (1 - p)).toFixed(1);
    }
    setRingProgress(0);

    function updateState(isPlaying) {
      if (card) card.classList.toggle("playing", isPlaying);
      if (icoPlay) icoPlay.style.display = isPlaying ? "none" : "block";
      if (icoPause) icoPause.style.display = isPlaying ? "block" : "none";
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(function(){ updateState(true); }).catch(function(){});
      } else {
        audio.pause();
        updateState(false);
      }
    }

    fab.addEventListener("click", function(e) {
      e.stopPropagation();
      floatWrap.classList.toggle("open");
    });

    document.addEventListener("click", function(e) {
      if (floatWrap.classList.contains("open") && !floatWrap.contains(e.target)) {
        floatWrap.classList.remove("open");
      }
    });

    if (playBtn) playBtn.addEventListener("click", togglePlay);

    audio.addEventListener("timeupdate", function() {
      var d = audio.duration;
      var c = audio.currentTime;
      if (d && isFinite(d) && d > 0) {
        var pct = (c / d) * 100;
        if (fill) fill.style.width = pct + "%";
        setRingProgress(c / d);
        if (curTime) curTime.textContent = formatTime(c);
        if (durTime) durTime.textContent = formatTime(d);
      }
    });

    audio.addEventListener("loadedmetadata", function() {
      if (durTime) durTime.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("play", function() { updateState(true); });
    audio.addEventListener("pause", function() { updateState(false); });

    if (seekBar) {
      seekBar.addEventListener("click", function(e) {
        var rect = seekBar.getBoundingClientRect();
        var pos = (e.clientX - rect.left) / rect.width;
        if (audio.duration) {
          audio.currentTime = pos * audio.duration;
        }
      });
    }

    if (volSlider) {
      audio.volume = parseFloat(volSlider.value) || 0.8;
      volSlider.addEventListener("input", function() {
        audio.volume = parseFloat(volSlider.value);
        if (audio.volume === 0) {
          if (icoVol) icoVol.style.display = "none";
          if (icoMuted) icoMuted.style.display = "block";
        } else {
          if (icoVol) icoVol.style.display = "block";
          if (icoMuted) icoMuted.style.display = "none";
        }
      });
    }

    if (muteBtn) {
      muteBtn.addEventListener("click", function() {
        audio.muted = !audio.muted;
        if (audio.muted) {
          if (icoVol) icoVol.style.display = "none";
          if (icoMuted) icoMuted.style.display = "block";
        } else {
          if (icoVol) icoVol.style.display = "block";
          if (icoMuted) icoMuted.style.display = "none";
        }
      });
    }

    /* First user click on page automatically starts gentle playback if not started */
    var hasInteracted = false;
    function autoStartOnInteraction() {
      if (hasInteracted) return;
      hasInteracted = true;
      audio.play().then(function(){ updateState(true); }).catch(function(){});
    }
    document.addEventListener("click", autoStartOnInteraction, { once: true });
    document.addEventListener("keydown", autoStartOnInteraction, { once: true });
  })();
  </script>

  <!-- ===== Shorekeeper Bespoke Cosmic Particle Engine ===== -->
  <canvas id="shore-cosmos-canvas" class="shore-cosmos-canvas"></canvas>
  <script>
  (function(){
    var canvas = document.getElementById("shore-cosmos-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, dpr = 1;
    var stars = [];
    var meteors = [];
    var maxStars = 95;
    var isRunning = true;
    var nextMeteorTime = Date.now() + 1200;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    function createStar(initial) {
      var angle = 0.66 + (Math.random() - 0.5) * 0.16; // ~37 degrees diagonal slope (down-left)
      var isDust = Math.random() < 0.35;
      var speed = isDust ? (Math.random() * 0.35 + 0.25) : (Math.random() * 1.1 + 0.6);
      var radius = isDust ? (Math.random() * 0.6 + 0.5) : (Math.random() * 1.2 + 0.9);
      var trail = isDust ? (Math.random() * 6 + 3) : (Math.random() * 18 + 8);
      
      var x, y;
      if (initial) {
        x = Math.random() * (W + 200) - 50;
        y = Math.random() * (H + 100) - 50;
      } else {
        if (Math.random() < 0.65) {
          x = Math.random() * (W + 150);
          y = -15;
        } else {
          x = W + 15;
          y = Math.random() * (H * 0.85);
        }
      }

      return {
        x: x,
        y: y,
        vx: -Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        speed: speed,
        radius: radius,
        trail: trail,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.04 + 0.015,
        hue: Math.random()
      };
    }

    function createMeteor() {
      var angle = 0.68 + (Math.random() - 0.5) * 0.1;
      var speed = Math.random() * 3.5 + 4.5;
      var length = Math.random() * 65 + 50;
      return {
        x: Math.random() * (W * 0.8) + (W * 0.25),
        y: Math.random() * -30 - 10,
        vx: -Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        speed: speed,
        length: length,
        radius: Math.random() * 1.2 + 1.6,
        life: 1.0,
        decay: Math.random() * 0.008 + 0.008,
        hue: Math.random()
      };
    }

    function init() {
      resize();
      stars = [];
      for (var i = 0; i < maxStars; i++) {
        stars.push(createStar(true));
      }
    }

    function render() {
      if (!isRunning) return;
      ctx.clearRect(0, 0, W, H);
      var isDark = document.documentElement.classList.contains("dark");
      var now = Date.now();

      // Check meteor spawn
      if (now > nextMeteorTime && meteors.length < 2) {
        meteors.push(createMeteor());
        nextMeteorTime = now + Math.random() * 4000 + 2500;
      }

      // 1. Draw Meteors
      for (var m = meteors.length - 1; m >= 0; m--) {
        var met = meteors[m];
        met.x += met.vx;
        met.y += met.vy;
        met.life -= met.decay;

        if (met.life <= 0 || met.x < -100 || met.y > H + 100) {
          meteors.splice(m, 1);
          continue;
        }

        var tX = met.x - (met.vx / met.speed) * met.length;
        var tY = met.y - (met.vy / met.speed) * met.length;

        var mGrad = ctx.createLinearGradient(tX, tY, met.x, met.y);
        var mColor = isDark
          ? (met.hue < 0.5 ? "56, 189, 248" : "192, 132, 252")
          : (met.hue < 0.5 ? "14, 165, 233" : "129, 140, 248");

        mGrad.addColorStop(0, "rgba(" + mColor + ", 0)");
        mGrad.addColorStop(1, "rgba(" + mColor + ", " + (met.life * 0.9) + ")");

        ctx.save();
        ctx.strokeStyle = mGrad;
        ctx.lineWidth = met.radius * 1.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(tX, tY);
        ctx.lineTo(met.x, met.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = isDark ? "rgba(255, 255, 255, " + met.life + ")" : "rgba(79, 70, 229, " + met.life + ")";
        ctx.arc(met.x, met.y, met.radius * 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = "rgba(" + mColor + ", " + (met.life * 0.45) + ")";
        ctx.arc(met.x, met.y, met.radius * 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 2. Draw Drifting Starlight
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.x += s.vx;
        s.y += s.vy;
        s.phase += s.twinkleSpeed;

        var pulse = (Math.sin(s.phase) + 1) * 0.5;
        var opacity = 0.35 + pulse * 0.65;

        var tailX = s.x - (s.vx / s.speed) * s.trail;
        var tailY = s.y - (s.vy / s.speed) * s.trail;

        ctx.save();
        if (s.trail > 4) {
          var grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
          var sColor = isDark
            ? (s.hue < 0.45 ? "56, 189, 248" : (s.hue < 0.8 ? "192, 132, 252" : "255, 255, 255"))
            : (s.hue < 0.45 ? "14, 165, 233" : (s.hue < 0.8 ? "99, 102, 241" : "168, 85, 247"));

          grad.addColorStop(0, "rgba(" + sColor + ", 0)");
          grad.addColorStop(1, "rgba(" + sColor + ", " + (opacity * 0.85) + ")");

          ctx.strokeStyle = grad;
          ctx.lineWidth = s.radius * 1.1;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(s.x, s.y);
          ctx.stroke();
        }

        ctx.beginPath();
        var headColor = isDark
          ? (s.hue < 0.4 ? "rgba(255, 255, 255," : (s.hue < 0.75 ? "rgba(186, 230, 253," : "rgba(233, 213, 255,"))
          : (s.hue < 0.4 ? "rgba(79, 70, 229," : "rgba(14, 165, 233,");
        ctx.fillStyle = headColor + opacity + ")";
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();

        if (s.radius > 1.1) {
          ctx.beginPath();
          var haloColor = isDark ? "rgba(56, 189, 248," : "rgba(99, 102, 241,";
          ctx.fillStyle = haloColor + (opacity * 0.3) + ")";
          ctx.arc(s.x, s.y, s.radius * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        if (s.x < -30 || s.y > H + 30) {
          stars[i] = createStar(false);
        }
      }

      requestAnimationFrame(render);
    }

    init();
    render();

    window.addEventListener("resize", resize, { passive: true });
    document.addEventListener("visibilitychange", function(){
      isRunning = !document.hidden;
      if (isRunning) render();
    });
  })();
  </script>

  <!-- 页脚 -->
  <div th:replace="~{modules/footer :: footer}"></div>

  <!-- 第三方库（高亮/公式/灯箱，按需 CDN 加载） -->
  <div th:replace="~{modules/libs :: libs}"></div>

  <!-- 回到顶部（带滚动进度环） -->
  <button id="moe-totop" class="moe-totop" type="button" aria-label="Back to Top">
    <svg class="moe-totop-ring" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
      <circle class="moe-totop-track" cx="24" cy="24" r="21"/>
      <circle class="moe-totop-prog" cx="24" cy="24" r="21"/>
    </svg>
    <svg class="moe-totop-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>
  <script>
  (function(){
    function moeSiteBg(){
      var sb=document.querySelector(".moe-site-bg");
      if(!sb) return;
      var bg=sb.getAttribute("data-bg");
      if(bg && !sb.style.backgroundImage){ sb.style.backgroundImage="url('"+bg+"')"; }
      var mode=sb.getAttribute("data-mode");
      var isHome=!!document.getElementById("moe-home-flag");
      sb.style.display=(mode==="not_home" && isHome) ? "none" : "";
    }
    moeSiteBg();
    var btn=document.getElementById("moe-totop");
    var prog=btn && btn.querySelector(".moe-totop-prog");
    var nav=document.querySelector(".moe-navbar");
    var C=131.95; /* 2 * PI * r(21) 进度环周长 */
    function onScroll(){
      var y=window.pageYOffset;
      var max=document.documentElement.scrollHeight - window.innerHeight;
      var p=max>0 ? Math.min(1, Math.max(0, y/max)) : 0;
      if(btn){ if(y>300){btn.classList.add("show");}else{btn.classList.remove("show");} }
      if(prog){ prog.style.strokeDashoffset=(C*(1-p)).toFixed(1); }
      var hero=document.querySelector(".moe-hero");   /* 每次重查：Pjax 切页后大图会变 */
      if(nav&&hero){
        var navH=nav.offsetHeight||60;
        if(hero.getBoundingClientRect().bottom>navH+4){nav.classList.add("is-top");}
        else{nav.classList.remove("is-top");}
      } else if(nav){ nav.classList.remove("is-top"); }
    }
    window.addEventListener("scroll",onScroll,{passive:true});
    window.addEventListener("resize",onScroll,{passive:true});
    if(btn){ btn.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});}); }
    onScroll();
    window.MoesoraNavState=function(){ onScroll(); moeSiteBg(); };   /* 供 Pjax 切页后调用：刷新导航态 + 全站背景显隐 */

    /* 页脚滚动揭示（pre-reveal 仅在脚本就绪后施加，万一脚本失效页脚仍正常显示） */
    var f=document.querySelector(".moe-footer");
    var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(f && !reduce && ("IntersectionObserver" in window)){
      f.classList.add("moe-pre-reveal");
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ f.classList.add("is-revealed"); } });
      },{threshold:0.12});
      io.observe(f);
    }
  })();
  </script>

  <!-- 编译后的脚本（IIFE 普通脚本，用 defer 保证 DOM 就绪后执行；不用 type=module 以兼容各类手机浏览器） -->
  <script defer th:src="@{/assets/dist/moesora.js(v=${theme.spec.version})}"></script>

  <!-- 复制内容追加版权 -->
  <script th:if="${!#strings.isEmpty(theme.config.post?.copy_explain)}" th:inline="javascript">
  (function(){
    var tpl = (/*[[${theme.config.post.copy_explain}]]*/ "");
    document.addEventListener("copy", function(e){
      var sel = (window.getSelection && window.getSelection().toString()) || "";
      if(sel.length < 20) return;
      var extra = "\n\n" + tpl.replace(/\{url\}/g, location.href);
      try{ e.clipboardData.setData("text/plain", sel + extra); e.preventDefault(); }catch(err){}
    });
  })();
  </script>

  <!-- 自定义：外部 JS（body 末尾） -->
  <script th:each="j : ${theme.config.custom?.external_js_body}" th:if="${!#strings.isEmpty(j?.url)}"
          th:src="${j.url}"></script>
  <!-- 自定义：内嵌 JS（body 末尾） -->
  <script th:if="${!#strings.isEmpty(theme.config.custom?.inline_js_body)}"
          th:utext="${theme.config.custom.inline_js_body}"></script>
  <!-- Halo 插件 Footer 扩展注入点 -->
  <halo:footer />
</body>
