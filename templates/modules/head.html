<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:halo="https://halo.run">
<head th:fragment="head">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="theme-color" th:content="${theme.config.basic?.theme_color} ?: '#38bdf8'"/>
  <link rel="preconnect" th:href="${theme.config.custom?.cdn_base} ?: 'https://gcore.jsdelivr.net'" crossorigin="anonymous"/>
  <link rel="dns-prefetch" th:href="${theme.config.custom?.cdn_base} ?: 'https://gcore.jsdelivr.net'"/>
  <!-- SEO -->
  <th:block th:replace="~{modules/seo :: seo}"></th:block>

  <!-- Compiled Styles -->
  <link rel="stylesheet" th:href="@{/assets/dist/moesora.css(v=${theme.spec.version})}"/>

  <!-- Theme Color Overrides -->
  <style th:utext="${':root{--moe-theme:' + (theme.config.basic?.theme_color ?: '#38bdf8') + ';--moe-ol-hover:' + (theme.config.post?.ol_hover_color ?: '#818cf8') + ';}html.dark{--moe-theme:' + (theme.config.basic?.night_theme_color ?: '#818cf8') + ';}'}"></style>

  <!-- Shorekeeper Celestial UI & Glassmorphism Styling -->
  <style>
    /* Wish Wall Celestial Styling & Clearance */
    .moe-wish-wall { min-height: 280px; position: relative; margin-top: 24px; margin-bottom: 20px; }
    .moe-wish-card {
      border-radius: 16px !important;
      border: 1px solid rgba(56, 189, 248, 0.28) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, border-color 0.25s ease, z-index 0.1s ease !important;
      overflow: hidden !important;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12) !important;
    }
    .moe-wish-card::after {
      content: '✦';
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 11px;
      color: var(--moe-theme, #38bdf8);
      opacity: 0.6;
      pointer-events: none;
    }
    .moe-wish-card:hover {
      transform: translateY(-8px) scale(1.05) rotate(0deg) !important;
      box-shadow: 0 20px 40px rgba(56, 189, 248, 0.3), 0 0 25px rgba(129, 140, 248, 0.25) !important;
      border-color: rgba(56, 189, 248, 0.8) !important;
      z-index: 9999 !important;
    }
    .moe-wish-card.is-open {
      transform: translateY(-6px) scale(1.08) rotate(0deg) !important;
      z-index: 10000 !important;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35), 0 0 30px rgba(56, 189, 248, 0.35) !important;
      border-color: rgba(56, 189, 248, 0.9) !important;
      cursor: default;
    }
    .moe-wish-c-blue { background: rgba(224, 242, 254, 0.94) !important; color: #0369a1 !important; }
    .moe-wish-c-purple { background: rgba(243, 232, 255, 0.94) !important; color: #6b21a8 !important; }
    .moe-wish-c-pink { background: rgba(252, 231, 243, 0.94) !important; color: #9d174d !important; }
    .moe-wish-c-green { background: rgba(220, 252, 231, 0.94) !important; color: #15803d !important; }
    .moe-wish-c-orange { background: rgba(255, 237, 213, 0.94) !important; color: #9a3412 !important; }
    .moe-wish-c-yellow { background: rgba(254, 249, 195, 0.94) !important; color: #854d0e !important; }

    .dark .moe-wish-c-blue { background: rgba(12, 74, 110, 0.88) !important; color: #e0f2fe !important; }
    .dark .moe-wish-c-purple { background: rgba(88, 28, 135, 0.88) !important; color: #f3e8ff !important; }
    .dark .moe-wish-c-pink { background: rgba(131, 24, 67, 0.88) !important; color: #fce7f3 !important; }
    .dark .moe-wish-c-green { background: rgba(20, 83, 45, 0.88) !important; color: #dcfce7 !important; }
    .dark .moe-wish-c-orange { background: rgba(124, 45, 18, 0.88) !important; color: #ffedd5 !important; }
    .dark .moe-wish-c-yellow { background: rgba(113, 63, 18, 0.88) !important; color: #fef9c3 !important; }

    .moe-wish-replied {
      display: inline-block !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      padding: 2px 10px !important;
      border-radius: 999px !important;
      background: rgba(56, 189, 248, 0.18) !important;
      color: #0284c7 !important;
      margin: 6px 0 4px !important;
    }
    .dark .moe-wish-replied {
      background: rgba(56, 189, 248, 0.25) !important;
      color: #7dd3fc !important;
    }
    .moe-wish-reply-line {
      font-style: italic !important;
      font-size: 12.5px !important;
      opacity: 0.95 !important;
      margin-top: 4px !important;
      padding-left: 8px !important;
      border-left: 2px solid rgba(56, 189, 248, 0.5) !important;
    }
    .moe-wish-form {
      position: sticky !important;
      bottom: 16px !important;
      z-index: 1000 !important;
      margin: 24px auto 8px !important;
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(56, 189, 248, 0.35) !important;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12), 0 0 20px rgba(56, 189, 248, 0.15) !important;
    }
    .dark .moe-wish-form {
      background: rgba(15, 23, 42, 0.9) !important;
      border-color: rgba(56, 189, 248, 0.3) !important;
    }
    .moe-wish-send, .moe-cmt-submit {
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 10px !important;
      padding: 9px 20px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35) !important;
      transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease !important;
    }
    .moe-wish-send:hover, .moe-cmt-submit:hover {
      opacity: 0.95 !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.5) !important;
    }

    /* Comments System Styling */
    .moe-cmt-form {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      border-radius: 16px !important;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06), 0 0 16px rgba(56, 189, 248, 0.08) !important;
      padding: 18px !important;
    }
    .dark .moe-cmt-form {
      background: rgba(15, 23, 42, 0.88) !important;
      border-color: rgba(56, 189, 248, 0.25) !important;
    }
    .moe-cmt-fields {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) !important;
      gap: 10px !important;
      margin-bottom: 12px !important;
    }
    .moe-cmt-input, .moe-cmt-textarea {
      border: 1px solid rgba(56, 189, 248, 0.22) !important;
      border-radius: 10px !important;
      padding: 9px 12px !important;
      font-size: 13.5px !important;
      background: var(--moe-bg-2, #f8fafc) !important;
      color: var(--moe-text, #1e293b) !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
    }
    .dark .moe-cmt-input, .dark .moe-cmt-textarea {
      background: rgba(30, 41, 59, 0.7) !important;
      color: #f1f5f9 !important;
    }
    .moe-cmt-input:focus, .moe-cmt-textarea:focus, .moe-wish-nick:focus, .moe-wish-mail:focus, .moe-wish-ta:focus {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35) !important;
      outline: none !important;
    }
    .moe-cmt-item {
      border: 1px solid rgba(56, 189, 248, 0.18) !important;
      border-radius: 14px !important;
      padding: 14px 16px !important;
      margin-bottom: 14px !important;
      background: rgba(255, 255, 255, 0.65) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }
    .dark .moe-cmt-item {
      background: rgba(15, 23, 42, 0.65) !important;
      border-color: rgba(56, 189, 248, 0.2) !important;
    }
    .moe-cmt-item:hover {
      border-color: rgba(56, 189, 248, 0.45) !important;
      box-shadow: 0 8px 22px rgba(56, 189, 248, 0.12) !important;
    }
  </style>

  <!-- Custom External CSS -->
  <link th:each="c : ${theme.config.custom?.external_css}" th:if="${!#strings.isEmpty(c?.url)}"
        rel="stylesheet" th:href="${c.url}"/>
  <!-- Custom Inline CSS -->
  <style th:if="${!#strings.isEmpty(theme.config.custom?.inline_css)}"
         th:utext="${theme.config.custom.inline_css}"></style>

  <!-- Injected Configuration -->
  <script th:inline="javascript">
    /*<![CDATA[*/
    window.MoesoraConfig = {
      assetBase: /*[[@{/assets/}]]*/ "/assets/",
      hiddenTitle: /*[[${theme.config.basic?.document_hidden_title}]]*/ "(つ_<)~ Where did you go!",
      visibleTitle: /*[[${theme.config.basic?.document_visible_title}]]*/ "(*´∇｀*) Welcome back!",
      loadingText: /*[[${theme.config.loading?.loading_text}]]*/ "Starlight murmurs across the shore...",
      defaultTheme: /*[[${theme.config.basic?.default_theme}]]*/ "auto",
      effectsBg: /*[[${theme.config.effects?.effects_bg}]]*/ "none",
      effectsBgMode: /*[[${theme.config.effects?.effects_bg_mode}]]*/ "all",
      effectsClick: /*[[${theme.config.effects?.effects_click}]]*/ "none",
      effectsMove: /*[[${theme.config.effects?.effects_move}]]*/ "none",
      cursorStyle: /*[[${theme.config.effects?.cursor_style}]]*/ "default",
      pjax: /*[[${theme.config.effects?.enable_pjax}]]*/ false,
      codeFoldLine: /*[[${theme.config.post?.code_fold_line}]]*/ 0,
      imgFoldHeight: /*[[${theme.config.post?.img_fold_height}]]*/ 0,
      defaultCodeLang: /*[[${theme.config.post?.default_code_lang}]]*/ "",
      enableLightbox: /*[[${theme.config.post?.enable_lightbox}]]*/ true,
      extRedirect: {
        on: /*[[${theme.config.post?.external_redirect}]]*/ false,
        delay: /*[[${theme.config.post?.external_redirect_delay}]]*/ 9,
        whitelist: /*[[${theme.config.post?.external_redirect_whitelist}]]*/ ""
      },
      siteName: /*[[${site.title}]]*/ "",
      commentUpload: {
        url: /*[[${theme.config.comment?.comment_upload_url}]]*/ "",
        field: /*[[${theme.config.comment?.comment_upload_field} ?: 'file']]*/ "file",
        header: /*[[${theme.config.comment?.comment_upload_header}]]*/ "",
        resp: /*[[${theme.config.comment?.comment_upload_resp} ?: 'data.url']]*/ "data.url"
      }
    };
    /*]]>*/
  </script>
  <script>
    (function () {
      var cfg = window.MoesoraConfig || {};
      var saved = null;
      try { saved = localStorage.getItem("moesora-theme"); } catch (e) {}
      var def = cfg.defaultTheme || "auto";
      var dark;
      if (saved === "dark") dark = true;
      else if (saved === "light") dark = false;
      else if (def === "dark") dark = true;
      else if (def === "light") dark = false;
      else dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
      document.documentElement.setAttribute("data-color-scheme", dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
</body>
</html>
