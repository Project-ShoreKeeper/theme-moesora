<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:halo="https://halo.run"
      th:replace="~{modules/layout :: layout(content=~{::content}, hero=~{}, isHome=false)}">
<body>
<th:block th:fragment="content">

  <section class="moe-wish-header"
           th:with="sub=${theme.config.wishes?.wishes_subtitle} ?: 'Cast a thought into the starlit sea, where every memory echoes across the shore.'">
    <h1 class="moe-wish-title" th:text="${singlePage.spec.title} ?: 'Wish Wall'">Wish Wall</h1>
    <p class="moe-wish-sub" th:text="${sub}">Cast a thought into the starlit sea, where every memory echoes across the shore.</p>
  </section>

  <!-- Introduction Content from SinglePage -->
  <div class="moe-wish-intro moe-post-content"
       th:if="${singlePage.content != null and !#strings.isEmpty(singlePage.content.content)}"
       th:utext="${singlePage.content.content}"></div>

  <!-- Wish Wall Container -->
  <section id="moe-wishes"
           th:attr="data-name=${singlePage.metadata.name},
                    data-cats=${theme.config.wishes?.wishes_categories} ?: 'Wishes,Thoughts,Echoes,Feedback'"></section>

</th:block>
</body>
</html>
