<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layout :: layout(content=~{::content}, hero=~{}, isHome=false)}">
<body>
<th:block th:fragment="content">
  <div class="moe-page-head moe-card moe-fancy-head">
    <div class="moe-halo"><b class="moe-halo-num">0</b><small>Friends</small></div>
    <div class="moe-fancy-head-text">
      <h1 class="moe-page-title"><span class="moe-page-title-icon"><th:block th:replace="~{modules/icons :: icon('link')}"></th:block></span><span>Friend Links</span></h1>
      <p class="moe-links-sub" id="moe-links-hitokoto">Connecting with creative minds across the web ♪(´▽｀)</p>
    </div>
  </div>

  <th:block th:each="group,gStat : ${groups}">
    <div class="moe-card moe-link-group" th:classappend="${'moe-accent-' + (gStat.index % 5)}">
      <div class="moe-link-group-head">
        <h3 class="moe-card-title" th:text="${group.spec.displayName}">Group</h3>
        <span class="moe-link-count" th:text="${#lists.size(group.links)}">0</span>
      </div>
      <div class="moe-link-list">
        <a th:each="link,lStat : ${group.links}" class="moe-link-item"
           th:style="|animation-delay:${lStat.index * 60}ms|"
           th:href="${link.spec.url}" target="_blank" rel="noopener"
           th:title="${link.spec.description}">
          <span class="moe-link-logo-wrap">
            <img class="moe-link-logo"
                 th:if="${!#strings.isEmpty(link.spec.logo)}"
                 th:src="${link.spec.logo}" th:alt="${link.spec.displayName}" loading="lazy"/>
            <span th:if="${#strings.isEmpty(link.spec.logo)}"
                  th:classappend="${'moe-avatar-c' + (lStat.index % 6)}"
                  class="moe-link-logo moe-link-logo-fallback"
                  th:text="${#strings.isEmpty(link.spec.displayName) ? '?' : #strings.toUpperCase(#strings.substring(link.spec.displayName,0,1))}">A</span>
          </span>
          <span class="moe-link-meta">
            <span class="moe-link-name" th:text="${link.spec.displayName}">Site</span>
            <span class="moe-link-desc" th:text="${link.spec.description}">Description</span>
          </span>
        </a>
      </div>
    </div>
  </th:block>

  <div th:if="${groups == null or #lists.isEmpty(groups)}" class="moe-card moe-empty">
    No links added yet in Console (｡･ω･｡)
  </div>

  <div class="moe-card moe-links-apply">
    <h3 class="moe-card-title"><span class="moe-title-ico"><th:block th:replace="~{modules/icons :: icon('heart')}"></th:block></span>Want to exchange links?</h3>
    <p>Leave your <b>Site Name / URL / Avatar / Description</b> in the comments or Wish Wall, and I will gladly add you! (๑•̀ㅂ•́)و✧</p>
  </div>

  <script>
  (function(){
    var lines=[
      "Connecting with creative minds across the web ♪(´▽｀)",
      "Click an avatar to explore their tranquil world~",
      "Here lie my treasured bookmarks across the vast sea ✿",
      "May you find kindred spirits beneath the starry expanse ✨",
      "Destiny brought us together upon this quiet shore (｡･ω･｡)ﾉ♡",
      "The vessel of friendship sails gently forward ⚓",
      "Wandering through digital streams, all wanderers are friends ✿",
      "To meet is serendipity; thank you for pausing here (´▽｀)ノ",
      "These are our cherished digital neighbors across the stars~",
      "Open a portal and discover a new starlit world ✨",
      "Kindred minds meeting in resonance ♪",
      "May the world treat us with tender warmth (｡◕‿◕｡)",
      "Illuminating each other across the quiet void ⋆｡°✩",
      "Let us journey into cyberspace together 🚀",
      "Feel free to visit often; the sanctuary doors are open~",
      "A quiet ripple carrying boundless warmth (◍•ᴗ•◍)"
    ];
    var h=document.getElementById('moe-links-hitokoto'); if(h){h.textContent=lines[Math.floor(Math.random()*lines.length)];}
    var n=document.querySelector('.moe-halo-num'); if(n){n.textContent=document.querySelectorAll('.moe-link-item').length;}
    
  })();
  </script>
</th:block>
</body>
</html>
