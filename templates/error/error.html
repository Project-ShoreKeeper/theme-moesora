<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layout :: layout(content=~{::content}, hero=~{}, isHome=false)}">
<body>
<th:block th:fragment="content">
  <div class="moe-card moe-error">
    <div class="moe-error-face">(´；ω；｀)</div>
    <div class="moe-error-code" th:if="${status != null}" th:text="${status}">404</div>
    <h1 class="moe-error-title" th:text="${status == 404 ? 'Page Not Found' : 'Something Went Wrong'}">Error</h1>
    <p class="moe-error-sub"
       th:text="${status == 404 ? 'The page you are looking for seems to have drifted away.' : 'An unexpected error occurred. Please try again later.'}">An error occurred.</p>
    <a class="moe-error-home" th:href="@{/}">← Return to Home</a>
  </div>
</th:block>
</body>
</html>
